<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- window body -->
  <rect x="40" y="28" width="1120" height="244" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M40,42 a14,14 0 0 1 14,-14 h1092 a14,14 0 0 1 14,14 v30 h-1120 z" fill="#1d2021"/>
  <line x1="40" y1="72" x2="1160" y2="72" stroke="#504945" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="70" cy="50" r="7" fill="#fb4934"/>
  <circle cx="94" cy="50" r="7" fill="#fabd2f"/>
  <circle cx="118" cy="50" r="7" fill="#b8bb26"/>

  <!-- title -->
  <text x="600" y="55" text-anchor="middle" font-size="17" fill="#a89984">lauren@github: ~</text>

  <!-- scanline overlay -->
  <rect x="40" y="72" width="1120" height="200" fill="url(#scan)"/>

  <!-- body content -->
  <text x="80" y="130" font-size="20" fill="#8ec07c">$ whoami</text>

  <text x="80" y="190" font-size="58" font-weight="700" fill="#ebdbb2">Lauren Henderson</text>
  <rect x="82" y="205" width="120" height="4" fill="#fe8019"/>

  <text x="80" y="245" font-size="21" fill="#fe8019">ml engineer&#160;&#160;·&#160;&#160;data scientist&#160;&#160;·&#160;&#160;berkeley '28</text>

  <!-- blinking cursor -->
  <rect x="1035" y="228" width="16" height="24" fill="#fe8019">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
